<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CTF Login</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .login-box {
            background: rgba(0, 0, 0, 0.65);
            padding: 40px;
            width: 320px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .login-box h1 {
            margin-bottom: 10px;
            font-size: 26px;
            letter-spacing: 1px;
        }

        .login-box p {
            margin-bottom: 30px;
            font-size: 14px;
            color: #bbb;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: none;
            outline: none;
            border-radius: 6px;
            background: #1e1e1e;
            color: #fff;
            font-size: 14px;
        }

        .login-box input::placeholder {
            color: #777;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #00c6ff;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .login-box button:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.6);
        }

        .hint {
            margin-top: 20px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>CTF Login</h1>
        <p>Authorized access only</p>

        <form method="POST" action="login.php">
            <input type="text" name="login" placeholder="Login">
            <input type="password" name="password" placeholder="Password">
            <button type="submit">Sign in</button>
        </form>

        <div class="hint">
            <!-- бекенд использует sql -->
        </div>
    </div>

</body>
</html>
