<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 Цветочный сад | Вход</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        
        /* Анимированные цветы на фоне */
        .flower-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .flower-bg {
            position: absolute;
            font-size: 40px;
            opacity: 0.2;
            animation: float 15s infinite linear;
        }
        
        .flower-bg:nth-child(1) { top: 10%; left: 5%; animation-delay: 0s; color: #ff6b8b; }
        .flower-bg:nth-child(2) { top: 20%; right: 10%; animation-delay: 3s; color: #4ecdc4; }
        .flower-bg:nth-child(3) { bottom: 20%; left: 15%; animation-delay: 6s; color: #ffd166; }
        .flower-bg:nth-child(4) { bottom: 10%; right: 20%; animation-delay: 9s; color: #ff6b8b; }
        .flower-bg:nth-child(5) { top: 40%; left: 25%; animation-delay: 12s; color: #4ecdc4; }
        
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(90deg); }
            50% { transform: translateY(-40px) rotate(180deg); }
            75% { transform: translateY(-20px) rotate(270deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }
        
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            z-index: 1;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            padding: 40px 30px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .logo-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .logo-emoji {
            font-size: 2.5rem;
            animation: bounce 2s infinite;
        }
        
        .logo-emoji:nth-child(1) { animation-delay: 0s; color: #ff6b8b; }
        .logo-emoji:nth-child(2) { animation-delay: 0.2s; color: #4ecdc4; }
        .logo-emoji:nth-child(3) { animation-delay: 0.4s; color: #ffd166; }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5eb;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Nunito', sans-serif;
            transition: border-color 0.3s;
            background: rgba(255, 255, 255, 0.9);
        }
        
        input:focus {
            outline: none;
            border-color: #ff6b8b;
            box-shadow: 0 0 0 3px rgba(255, 107, 139, 0.1);
        }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff6b8b 0%, #ff8e53 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-top: 10px;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(255, 107, 139, 0.3);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .demo-credentials {
            margin-top: 25px;
            padding: 15px;
            background: rgba(248, 249, 250, 0.8);
            border-radius: 10px;
            border-left: 4px solid #4ecdc4;
        }
        
        .demo-title {
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .demo-text {
            color: #666;
            font-size: 0.9rem;
        }
        
        .error-message {
            background: rgba(255, 234, 234, 0.9);
            color: #d63031;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        
        .loading {
            display: none;
            color: #666;
            margin-top: 10px;
        }
        
        .footer {
            margin-top: 30px;
            color: #888;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="flower-background">
        <div class="flower-bg">🌸</div>
        <div class="flower-bg">🌺</div>
        <div class="flower-bg">🌼</div>
        <div class="flower-bg">🌷</div>
        <div class="flower-bg">💮</div>
    </div>
    
    <div class="container">
        <div class="login-card">
            <div class="logo-header">
                <div class="logo-emoji">🌸</div>
                <div class="logo-emoji">🌺</div>
                <div class="logo-emoji">🌼</div>
            </div>
            
            <h1>Цветочный сад</h1>
            <p class="subtitle">Добро пожаловать в наш волшебный сад</p>
            
            <div class="error-message" id="errorMessage"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i> Имя пользователя
                    </label>
                    <input type="text" id="username" name="username" placeholder="Введите имя" required>
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Пароль
                    </label>
                    <input type="password" id="password" name="password" placeholder="Введите пароль" required>
                </div>
                
                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> Войти в сад
                </button>
                
                <div class="loading" id="loading">
                    <i class="fas fa-spinner fa-spin"></i> Вход...
                </div>
            </form>
            
            <div class="demo-credentials">
                <div class="demo-title">
                    <i class="fas fa-key"></i> Тестовый доступ
                </div>
                <div class="demo-text">
                    Используйте для входа:<br>
                    <strong>Логин:</strong> guest<br>
                    <strong>Пароль:</strong> guest
                </div>
            </div>
            
            <div class="footer">
                Система управления доступом в ботанический сад
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const loading = document.getElementById('loading');
            const submitBtn = document.querySelector('.btn-login');
            
            // Сброс ошибки
            errorMessage.style.display = 'none';
            submitBtn.disabled = true;
            loading.style.display = 'block';
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Успешный вход, перенаправляем
                    window.location.href = data.redirect;
                } else {
                    // Показать ошибку
                    errorMessage.textContent = data.error || 'Ошибка входа';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                errorMessage.textContent = 'Ошибка соединения с сервером';
                errorMessage.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        });
        
        // Автофокус на поле логина
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('username').focus();
        });
    </script>
</body>
</html>
